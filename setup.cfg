[metadata]
name = sphinxcontrib-bitfield
version = 2.0.0
author = Arthur Gay
description = Sphinx "bitfield" extension
long_description = file: README.rst
long_description_content_type = text/x-rst
url = https://github.com/Arth-ur/sphinxcontrib-bitfield
keywords = sphinx, extension, documentation, bitfield, bytefield, diagram, renderer, svg
license = BSD
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Environment :: Web Environment
    Intended Audience :: Developers
    License :: OSI Approved :: BSD License
    Operating System :: OS Independent
    Programming Language :: Python
    Framework :: Sphinx :: Extension
    Topic :: Documentation
    Topic :: Utilities

[options]
install_requires =
    bit-field @ git+https://github.com/len0rd/bitfield.git@25d89691a7eebeeb24e31759b762390e72ddca06#egg=bit-field
    Sphinx>=0.6
packages = find:
namespace_packages =
    sphinxcontrib
